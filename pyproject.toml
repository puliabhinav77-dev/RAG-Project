[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Puli-Abhinav", email = "abhinavsec22@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
